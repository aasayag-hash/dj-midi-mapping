name: Recibir aportes

# Valida cada pull request, lo fusiona si está bien y regenera index.json.
# Corre con pull_request_target: usa SIEMPRE los scripts de main y lee el aporte solo como datos.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recibir-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recibir:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      AUTOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Traer el aporte (solo como datos)
        run: git fetch origin "pull/$PR/head:aporte"

      - name: Validar
        id: validar
        run: |
          if python3 tools/validar.py --base origin/main --head aporte --autor "$AUTOR" > resultado.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat resultado.txt

      - name: Rechazar
        if: steps.validar.outputs.ok != 'true'
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file resultado.txt
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
          exit 1

      - name: Fusionar
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash

      - name: Regenerar el índice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/indice.py
            if git diff --quiet -- index.json; then exit 0; fi
            git commit -m "Actualizar índice" -- index.json
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 3))
          done
          exit 1
